<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Google Reviews...</title>

  <!-- Prevent aggressive browser caching (similar to 302 temporary redirect) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- =========================================================================
       CONFIGURATION: Replace the PLACE_ID value below with your Google Place ID
       ========================================================================= -->
  <script>
    // PASTE YOUR GOOGLE PLACE ID HERE:
    const GOOGLE_PLACE_ID = "ChIJN3j1BgApCTkRQqO70fVqT90";

    // Target URL appends ",5" to automatically pre-fill 5 stars
    const TARGET_URL = "https://search.google.com/local/writereview?placeid=" + encodeURIComponent(GOOGLE_PLACE_ID) + ",5";

    // Execute fast JavaScript redirect without adding an extra entry to browser history
    window.location.replace(TARGET_URL);
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B0B0B;
      color: #FFF6DC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 209, 47, 0.15);
      border-top-color: #FFD12F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #FFF6DC;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    p {
      font-size: 0.95rem;
      color: rgba(255, 246, 220, 0.7);
      max-width: 420px;
      line-height: 1.5;
    }
    a {
      color: #FFD12F;
      text-decoration: underline;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="spinner" role="status" aria-label="Loading"></div>
  <h1>Redirecting you to share your experience...</h1>
  <p>If you are not redirected in 3 seconds, <a id="fallback-link" href="#">click here</a>.</p>

  <script>
    // Wire up the manual fallback link to the same target URL
    const link = document.getElementById("fallback-link");
    if (link) {
      link.href = TARGET_URL;
    }

    // Secondary fallback timeout in case window.location.replace is throttled
    setTimeout(function() {
      window.location.href = TARGET_URL;
    }, 3000);
  </script>
</body>
</html>
